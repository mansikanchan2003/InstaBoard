# InstaBoard — production-style deployment (single host, Docker Compose v2).
#
#   cp deploy/env.production.example deploy/.env.production    # fill in real values (never commit this file)
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.production build
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.production up -d
#
# Exposure: only `web` publishes a port (bound to 127.0.0.1 by default — put a TLS reverse proxy / load balancer in
# front, or set WEB_BIND=0.0.0.0 behind a firewall). PostgreSQL, Redis, the API, worker and beat stay on the private
# network. Migrations run once per deploy in the `migrate` job before api/worker/beat start; app replicas never
# migrate on startup. Run exactly ONE `beat`.

name: instaboard-prod   # distinct from the dev compose project ("instaboard") so they can never replace each other

x-backend: &backend
  image: ${BACKEND_IMAGE:-instaboard-backend:local}
  build:
    context: ./backend
  env_file:
    - deploy/.env.production
  environment:
    APP_ENV: production
    LOG_FORMAT: json
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-instaboard}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    # The API is reachable only through `web` on the private network, so forwarded headers from it are trusted.
    FORWARDED_ALLOW_IPS: "*"
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  networks:
    - private

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-instaboard}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { memory: 1g }
    networks:
      - private

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --save '' --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { memory: 256m }
    networks:
      - private

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 768m }

  worker:
    <<: *backend
    command: ["sh", "-c", "exec celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=$${INSTAGRAM_WORKER_CONCURRENCY:-2} --hostname=worker@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d worker@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s   # warm shutdown lets the current job finish; leases recover anything killed
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 768m }

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: 1   # exactly one scheduler; duplicate ticks would be harmless (advisory lock + unique index) but wasteful
      resources:
        limits: { memory: 256m }

  web:
    image: ${WEB_IMAGE:-instaboard-web:local}
    build:
      context: ./frontend
      args:
        VITE_DATA_SOURCE: api
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 128m }
    networks:
      - private

networks:
  private: {}

volumes:
  pgdata: {}
  redisdata: {}

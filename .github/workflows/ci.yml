# Quality gates for every push / pull request. No deployment happens here and no production secrets are used:
# the database is a throwaway service container and Meta/AI are mocked in the test suites.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: instaboard
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: instaboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U instaboard -d instaboard" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://instaboard:ci-only-not-a-secret@localhost:5432/instaboard
      TEST_DATABASE_URL: postgresql+psycopg://instaboard:ci-only-not-a-secret@localhost:5432/instaboard_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff — correctness rules)
        run: ruff check .
      - name: Create test database
        run: PGPASSWORD=ci-only-not-a-secret psql -h localhost -U instaboard -d instaboard -c "CREATE DATABASE instaboard_test"
      - name: Migrations apply cleanly from an empty database
        run: alembic upgrade head
      - name: Models and migrations have not drifted
        run: alembic check
      - name: Downgrade/upgrade round trip of the latest migration
        run: alembic downgrade -1 && alembic upgrade head
      - name: Tests (Meta and AI providers are mocked)
        run: pytest -q

  frontend:
    name: Frontend (types, tests, builds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:api

  docker:
    name: Docker images and Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t instaboard-backend:ci ./backend
      - name: Build web image
        run: docker build -t instaboard-web:ci ./frontend
      - name: Validate production Compose file (with dummy values)
        run: |
          cp deploy/env.production.example deploy/.env.production
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-dummy/; s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci-dummy/' deploy/.env.production
          docker compose -f docker-compose.prod.yml --env-file deploy/.env.production config --quiet
      - name: Images run as non-root
        run: |
          test "$(docker run --rm --entrypoint id instaboard-backend:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id instaboard-web:ci -u)" != "0"

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (backend runtime dependencies)
        run: pip install pip-audit==2.10.1 && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (production dependencies, high and above)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# InstaBoard web server: static SPA + same-origin reverse proxy to the API.
# TLS is expected to terminate at an upstream load balancer / ingress (which sets X-Forwarded-Proto), or add a
# TLS server block here. HSTS is emitted by the API for /api responses when COOKIE_SECURE=true; add it at the TLS
# terminator for the whole site.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;   # matches MAX_REQUEST_BYTES on the API

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API, OAuth callback and Meta callbacks — proxied to the private API service.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # The API sets its own security headers on /api responses.
    }

    # Fingerprinted build assets: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: unknown paths serve index.html (client-side routing); index.html itself is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
